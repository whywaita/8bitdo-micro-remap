    <meta charset="utf-8" />

    <a class="skip" href="#main">本文へ</a>
    <div class="review-bar">

    <header>

    <main id="main">
      <div class="eyebrow">02 編集 / 12</div>
      <div class="screen">
        <h1>キーの組み合わせを入力</h1>
        <p class="lead">割り当てたいキーを押してください。</p>
        <div class="content">
          <div class="capture" tabindex="0">
            入力待ち<br /><small>例：Ctrl + Shift + T</small>
          </div>
          <div class="notice">
            Escape も割り当て可能です。入力中の Escape
            では編集画面を閉じません。
          </div>
        </div>
        <div class="actions">
          <a class="button" href="editor.html">入力を終了</a
          ><a class="button" href="ready.html">キャンセル</a>
        </div>
      </div>
      <aside class="annotation">
        <b>画面仕様 · capture</b>
        <p>静的な入力待ち状態。実際のキー捕捉は行わない。</p>
        <div class="scenario-nav">
          <a class="button" href="editor.html">← 前の状態</a
          ><a class="button" href="picker-empty.html">次の状態 →</a>
        </div>
      </aside>
    </main>
    <footer>
