        <h1>プロファイルを読み込む</h1>
        <p class="lead">名前を付けて書き出した JSON ファイルを選択します。</p>
        <div class="content">
          <label for="profile-file">プロファイルファイル</label
          ><input
            id="profile-file"
            type="file"
            accept=".json,application/json"
          />

          </div>
        </div>
        <div class="actions">

        <b>画面仕様 · import</b>
