    <div class="review-bar">
      <span>WIREFRAME / 静的サンプル · 実機操作なし</span

    </div>
    <header>
      <a class="brand" href="welcome.html"

      <nav aria-label="メイン">
        <a href="ready.html">Mapping</a><a href="backups.html">Backups</a
        ><a href="help.html">Support</a>

    <main id="main">
      <div class="eyebrow">02 編集 / 11</div>
      <div class="screen">
        <h1>A の割り当てを編集</h1>
        <p class="lead">現在の割り当て：Enter</p>
        <div class="content">
          <label for="key-search">キーを検索</label
          ><input
            id="key-search"
            type="search"
            placeholder="Enter、Escape、F1…"
          />
          <div class="picker">
            <a class="button" href="editor.html">Enter</a
            ><a class="button" href="editor.html">Escape</a
            ><a class="button" href="editor.html">Space</a
            ><a class="button" href="editor.html">Tab</a
            ><a class="button" href="editor.html">F1</a
            ><a class="button" href="editor.html">↑</a>
          </div>
          <fieldset>
            <legend>左側の修飾キー</legend>
            <label><input type="checkbox" checked /> Ctrl</label
            ><label><input type="checkbox" /> Alt</label
            ><label><input type="checkbox" /> Shift</label
            ><label><input type="checkbox" /> Meta</label>
          </fieldset>
          <div class="preview">Ctrl + W</div>
        </div>
        <div class="actions">
          <a class="button primary" href="dirty.html">下書きに適用</a
          ><a class="button" href="ready.html">キャンセル</a
          ><a class="button" href="capture.html">キーボードから入力</a
          ><a class="button" href="disabled.html">無効にする</a
          ><a class="button" href="picker-empty.html">検索結果なしの例</a>
        </div>
      </div>
      <aside class="annotation">
        <b>画面仕様 · editor</b>
        <p>入力欄は見た目の確認用。キー一覧・適用後の値は固定サンプル。</p>
